{% load static %}
<div class="auth-emblem-wrap">
    <img src="{% static 'images/logo.svg' %}" alt="emblem" class="auth-emblem">
</div>
<h2>Reset Your Password</h2>
<p class="auth-subtitle">Enter your email and we'll send you a link to reset your password.</p>

<form method="POST">
    {% csrf_token %}

    <div class="form-group">
        <label for="id_email">Email</label>
        <div class="input-with-icon">
            <img src="{% static 'images/email.svg' %}" alt="" class="input-icon">
            {{ form.email }}
        </div>
        {% if form.email.errors %}
        <p style="color: red;">{{ form.email.errors }}</p>
        {% endif %}
    </div>

    <button type="submit">Send Reset Link</button>
</form>

<p><a href="{% url 'accounts:login' %}">Back to login</a></p>
