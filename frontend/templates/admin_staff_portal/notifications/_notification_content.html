

<div class="notifications-page">
    {% for message in messages %}
        <div class="notification-message">
            {{ message }}
        </div>
    {% endfor %}

    <div class="notification-filters">
        <form method="get" class="notification-filter-form">
            <div class="notification-filter-group">
            <label for="notification-type">
                Type
            </label>

            <select
                id="notification-type"
                name="type"
            >
                <option value="">
                    All Types
                </option>

                {% for value, label in notification_type_choices %}
                    <option
                        value="{{ value }}"
                        {% if selected_type == value %}selected{% endif %}
                    >
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
            </div>

            <div class="notification-filter-group">
            <label for="notification-read">
                Status
            </label>

            <select
                id="notification-read"
                name="read"
            >
                <option
                    value=""
                    {% if not selected_read %}selected{% endif %}
                >
                    All
                </option>

                <option
                    value="unread"
                    {% if selected_read == 'unread' %}selected{% endif %}
                >
                    Unread
                </option>

                <option
                    value="read"
                    {% if selected_read == 'read' %}selected{% endif %}
                >
                    Read
                </option>
            </select>
            </div>

            <div class="notification-filter-group">
            <label for="notification-sort">
                Sort
            </label>

            <select
                id="notification-sort"
                name="sort"
            >
                <option
                    value="newest"
                    {% if selected_sort == 'newest' %}selected{% endif %}
                >
                    Newest
                </option>

                <option
                    value="oldest"
                    {% if selected_sort == 'oldest' %}selected{% endif %}
                >
                    Oldest
                </option>
            </select>
            </div>

            <div class="notification-filter-actions">
            <button
                type="submit"
                class="notification-filter-button"
            >
                Apply
            </button>

            <a
                href="{% url 'notifications:notification_list' %}"
                class="notification-reset-button"
            >
                Reset
            </a>
            </div>
        </form>

        <div class="notifications-header-actions">
            {% if request.user.is_admin and request.user.is_superuser %}
                <a
                    href="{% url 'notifications:create_system_notification' %}"
                    class="create-notification-button"
                >
                    Create Notification
                </a>
            {% endif %}

            <form
                method="post"
                action="{% url 'notifications:mark_all_read' %}"
            >
                {% csrf_token %}

                <button
                    type="submit"
                    class="notification-reset-button"
                >
                    Mark All as Read
                </button>
            </form>
        </div>
    </div>

    <div id="notification-list-container">
        {% include 'admin_staff_portal/notifications/_notifications_list.html' %}
    </div>
</div>
