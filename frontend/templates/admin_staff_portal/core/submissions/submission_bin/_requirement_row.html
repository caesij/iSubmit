<tr data-row-id="{{ req.id }}">
    <td class="font-bold">
        {{ req.requirement_title }}
        {% if not req.is_required %}<span class="status-badge status-inactive">Optional</span>{% endif %}
    </td>

    <td>
        <div class="progress-wrap">
            <span>{{ req.completion_progress }}%</span>
        </div>
    </td>

    <td>
        <span class="status-badge {% if req.is_active %}status-active{% else %}status-inactive{% endif %}">
            {{ req.get_status_display }}
        </span>
    </td>

    <td>
        <span class="ocr-badge {% if req.text_extraction_enabled %}ocr-enabled{% else %}ocr-disabled{% endif %}">
            {% if req.text_extraction_enabled %}Enabled{% else %}Disabled{% endif %}
        </span>
    </td>

    <td>
        <span class="ocr-badge {% if req.validation_enabled %}ocr-enabled{% else %}ocr-disabled{% endif %}">
            {% if req.validation_enabled %}Enabled{% else %}Disabled{% endif %}
        </span>
    </td>

    <td class="action-cell">
        <div class="dropdown">
            <button type="button" class="btn-icon" aria-label="Actions" aria-expanded="false">⋮</button>

            <div class="dropdown-menu">
                <form action="{% url 'admin_staff_portal:toggle_requirement_status' req.id %}" method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <button type="submit">{% if req.is_active %}Deactivate{% else %}Activate{% endif %}</button>
                </form>
            </div>
        </div>
    </td>
</tr>
