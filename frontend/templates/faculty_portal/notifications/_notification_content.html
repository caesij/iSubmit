<style>
.notifications-page {
    padding: 24px 32px;
    color: #1a1a1a;
    font-family: 'Segoe UI', Arial, sans-serif;
}

.notifications-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
}

.notifications-header h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
}

.notifications-header p {
    margin: 4px 0 0;
    font-size: 13px;
    color: #6b7280;
}

.notifications-header form {
    margin: 0;
}

.notification-filters {
    display: flex;
    align-items: end;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 16px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.notification-filter-group {
    min-width: 180px;
}

.notification-filter-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 12px;
    font-weight: 600;
    color: #374151;
}

.notification-filter-group select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
}

.notification-filter-actions {
    display: flex;
    gap: 8px;
}

.notification-filter-button,
.notification-reset-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 9px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
}

.notification-filter-button {
    border: 1px solid #7f1d1d;
    background: #7f1d1d;
    color: #fff;
}

.notification-reset-button {
    border: 1px solid #b91c1c;
    background: #fff;
    color: #b91c1c;
}

.notification-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.notification-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.notification-card.unread {
    border-left: 4px solid #b91c1c;
    background: #fffafa;
}

.notification-card-content {
    min-width: 0;
}

.notification-card-content h3 {
    margin: 0 0 5px;
    font-size: 14px;
    font-weight: 700;
    color: #1a1a1a;
}

.notification-card-content p {
    margin: 0 0 7px;
    font-size: 13px;
    line-height: 1.5;
    color: #6b7280;
    white-space: pre-line;
}

.notification-card-content .notification-meta {
    font-size: 11px;
    color: #9ca3af;
}

.notification-card-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.notification-card-actions form {
    margin: 0;
}

.notification-card-actions button,
.notification-card-actions a {
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 11px;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
}

.notification-card-actions button {
    border: 1px solid #e5e7eb;
    background: #fff;
    color: #374151;
}

.notification-card-actions button.notification-view-button {
    border-color: #7f1d1d;
    background: #7f1d1d;
    color: #fff;
}

.notification-card-actions a {
    border: 1px solid #7f1d1d;
    background: #7f1d1d;
    color: #fff;
}

.notification-empty {
    padding: 40px 20px;
    text-align: center;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    color: #6b7280;
    font-size: 13px;
}

.notification-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
}

.notification-pagination .page-btn {
    min-width: 34px;
    padding: 8px 10px;
    border: 1px solid #e5e7eb;
    border-radius: 7px;
    background: #fff;
    color: #374151;
    text-align: center;
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
}

.notification-pagination .page-btn.active {
    border-color: #7f1d1d;
    background: #7f1d1d;
    color: #fff;
}

.notification-pagination .page-info {
    font-size: 12px;
    color: #6b7280;
}
</style>

<div class="notifications-page">
    <div class="notifications-header">
        <div>
            <h2>Notifications</h2>
            <p>View and manage your notifications.</p>
        </div>

        <form
            method="post"
            action="{% url 'notifications:mark_all_read' %}"
        >
            {% csrf_token %}

            <button
                type="submit"
                class="notification-reset-button"
            >
                Mark All as Read
            </button>
        </form>
    </div>

    <form
        method="get"
        class="notification-filters"
    >
        <div class="notification-filter-group">
            <label for="notification-type">
                Type
            </label>

            <select
                id="notification-type"
                name="type"
            >
                <option value="">
                    All Types
                </option>

                {% for value, label in notification_types %}
                    <option
                        value="{{ value }}"
                        {% if selected_type == value %}selected{% endif %}
                    >
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="notification-filter-group">
            <label for="notification-read">
                Status
            </label>

            <select
                id="notification-read"
                name="read"
            >
                <option
                    value=""
                    {% if not selected_read %}selected{% endif %}
                >
                    All
                </option>

                <option
                    value="unread"
                    {% if selected_read == 'unread' %}selected{% endif %}
                >
                    Unread
                </option>

                <option
                    value="read"
                    {% if selected_read == 'read' %}selected{% endif %}
                >
                    Read
                </option>
            </select>
        </div>

        <div class="notification-filter-group">
            <label for="notification-sort">
                Sort
            </label>

            <select
                id="notification-sort"
                name="sort"
            >
                <option
                    value="newest"
                    {% if selected_sort == 'newest' %}selected{% endif %}
                >
                    Newest
                </option>

                <option
                    value="oldest"
                    {% if selected_sort == 'oldest' %}selected{% endif %}
                >
                    Oldest
                </option>
            </select>
        </div>

        <div class="notification-filter-actions">
            <button
                type="submit"
                class="notification-filter-button"
            >
                Apply
            </button>

            <a
                href="{% url 'notifications:notification_list' %}"
                class="notification-reset-button"
            >
                Reset
            </a>
        </div>
    </form>

    <div id="notification-list-container">
        {% include 'faculty_portal/notifications/_notifications_list.html' %}
    </div>
</div>
