services:
  redis:
    image: redis:7-alpine
    ports:
    - "6379:6379"

  web:
    build: .
    command: /app/entrypoint.sh
    depends_on:
      - redis
    volumes:
      - .:/app
      - staticfiles:/app/backend/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env

volumes:
  staticfiles: