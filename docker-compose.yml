services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    image: isubmit-backend
    command: /app/entrypoint.sh
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - staticfiles:/app/backend/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/1

  ocr-worker:
    image: isubmit-backend
    pull_policy: never
    working_dir: /app/backend
    entrypoint: []
    command: celery -A config worker --loglevel=info --pool=solo --concurrency=1
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - .:/app
      - paddle_models:/root/.paddlex
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CELERY_BROKER_URL: redis://redis:6379/1
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

volumes:
  staticfiles:
  paddle_models: